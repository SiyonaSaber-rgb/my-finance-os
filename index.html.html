<head>
<meta charset="utf-8">

<title>My Finance OS — God Mode Animated</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#155eef;--accent2:#7f56d9;--income:#039855;--expense:#d92d20;--warning:#dc6803;--shadow:0 12px 35px rgba(16,24,40,.07);--control:#eef2f6;--controlText:#344054;--input:#fff;--inputText:#101828}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),radial-gradient(circle at 80% 10%,color-mix(in srgb,var(--accent2) 10%,transparent),transparent 25%);animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate3d(2%,2%,0) scale(1.04)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 0%,transparent)}}.app{max-width:1260px;margin:auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 18px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:22px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
nav{display:flex;gap:7px;overflow:auto;margin-top:12px}nav button,.btn{border:0;border-radius:12px;background:var(--control);color:var(--controlText);padding:10px 13px;white-space:nowrap}nav button.active,.btn.primary{background:var(--accent);color:white;box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 25%,transparent)}nav button{transition:.2s}nav button:hover,.btn:hover{transform:translateY(-1px)}
main{padding:18px}.page{display:none}.page.active{display:block;animation:rise .35s ease both}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}h2{margin:0 0 5px}h3{margin:0 0 10px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);animation:rise .45s ease both}.metric strong{display:block;font-size:25px;margin-top:4px}.metric small,.kicker{color:var(--muted)}.kicker{text-transform:uppercase;font-size:10px;letter-spacing:.08em;font-weight:750}.big{font-size:30px;font-weight:800}
.income{color:var(--income)}.expense{color:var(--expense)}.accent{color:var(--accent)}.purple{color:var(--accent2)}.warning{color:var(--warning)}
.section{margin-top:20px}.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--control);color:var(--controlText);font-size:11px}.pill.in{background:color-mix(in srgb,var(--income) 12%,var(--surface));color:var(--income)}.pill.out{background:color-mix(in srgb,var(--expense) 12%,var(--surface));color:var(--expense)}.pill.transfer{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--input);color:var(--inputText);outline:none}.field textarea{min-height:75px}.field input::placeholder{color:var(--muted)}.full{grid-column:1/-1}
.chart{display:flex;align-items:center;justify-content:center;gap:24px;min-height:230px}.donut{width:165px;height:165px;border-radius:50%;background:conic-gradient(var(--accent) 0 45%,var(--accent2) 45% 68%,var(--income) 68% 86%,var(--warning) 86% 100%);position:relative;animation:spinIn .9s ease both}.donut:after{content:"";position:absolute;inset:36px;background:var(--surface);border-radius:50%}@keyframes spinIn{from{transform:rotate(-90deg) scale(.75);opacity:0}to{transform:none;opacity:1}}.legend div{margin:8px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.account{position:relative;overflow:hidden}.account::after{content:"";position:absolute;width:100px;height:100px;right:-35px;top:-35px;border-radius:50%;background:color-mix(in srgb,var(--accent) 8%,transparent)}.account-balance{font-size:25px;font-weight:800;margin:12px 0 2px}
.alert,.success{padding:12px;border-radius:13px;margin-top:10px}.alert{background:color-mix(in srgb,var(--warning) 13%,var(--surface));color:#b54708}.success{background:color-mix(in srgb,var(--income) 13%,var(--surface));color:var(--income)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.theme{padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font-weight:650}.theme.selected{border-color:var(--accent);background:var(--surface2)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.modalbox{background:var(--surface);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.drop{border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;background:var(--surface2);transition:.2s}.drop.drag{border-color:var(--accent);transform:scale(1.01)}.toast{display:none;position:fixed;z-index:70;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:white;border-radius:12px;padding:11px 16px;box-shadow:var(--shadow)}
@media(min-width:900px){.modal{align-items:center}.modalbox{border-radius:24px}}@media(max-width:850px){.grid,.grid3{grid-template-columns:1fr 1fr}.theme-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:13px}.grid,.grid3{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.chart{flex-direction:column}.legend{margin-bottom:15px}.big{font-size:25px}}

/* SOLARPUNK V2 OVERRIDES */
:root{
  --bg:#f3f7ec;--surface:#fbfff6;--surface2:#edf5df;--text:#183426;--muted:#647568;
  --line:#cbd9c2;--accent:#2f7d46;--accent2:#d99b32;--income:#23834d;--expense:#c24b3d;
  --warning:#b56a1e;--control:#e6f0dd;--controlText:#244332;--input:#fbfff7;--inputText:#183426;
  --glow:rgba(78,145,77,.20)
}
body{background:
 radial-gradient(circle at 12% 10%,rgba(241,188,67,.20),transparent 20%),
 radial-gradient(circle at 88% 20%,rgba(61,145,88,.16),transparent 24%),
 linear-gradient(180deg,#eef5e7 0%,#f8fbf3 46%,#edf4e5 100%);overflow-x:hidden}
body::after{content:"";position:fixed;inset:auto -10% -20% -10%;height:35vh;z-index:-2;
 background:radial-gradient(ellipse at 50% 100%,rgba(66,133,78,.16),transparent 62%);pointer-events:none}
header{background:rgba(248,252,242,.82);border-bottom:1px solid rgba(87,117,78,.25)}
.brand h1{letter-spacing:-.03em}
.brand h1::first-letter{filter:drop-shadow(0 0 7px rgba(217,155,50,.45))}
nav button{background:rgba(226,238,217,.82);border:1px solid rgba(77,115,77,.12)}
nav button.active,.btn.primary{background:linear-gradient(135deg,#2f7d46,#4c9b5b);box-shadow:0 8px 24px rgba(47,125,70,.22)}
.card{border:1px solid rgba(105,132,98,.25);box-shadow:0 16px 38px rgba(45,83,51,.08),inset 0 1px 0 rgba(255,255,255,.55)}
.card:hover{transform:translateY(-2px);box-shadow:0 20px 45px rgba(45,83,51,.12);transition:.25s}
.metric strong{letter-spacing:-.04em}
.account::before{content:"";position:absolute;left:-20px;top:-25px;width:120px;height:120px;border-radius:50%;
 background:radial-gradient(circle,rgba(217,155,50,.16),transparent 68%);animation:sunPulse 5s ease-in-out infinite}
@keyframes sunPulse{50%{transform:scale(1.18);opacity:.65}}
.bar{background:#e4ecdc}.bar span{background:linear-gradient(90deg,#4e9b5d,#d7a13b)}
.donut{background:conic-gradient(#4e9b5d 0 45%,#d7a13b 45% 68%,#6fa85d 68% 86%,#d06a4e 86% 100%);box-shadow:0 0 0 10px rgba(78,155,93,.06),0 18px 35px rgba(47,125,70,.16)}
.theme{background:var(--surface);color:var(--text)}
/* animated landscape */
#ecoScene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sun{position:absolute;width:130px;height:130px;border-radius:50%;right:7%;top:80px;
 background:radial-gradient(circle,#ffd56a 0 38%,rgba(255,213,106,.3) 58%,transparent 72%);
 filter:blur(.2px);animation:sunFloat 8s ease-in-out infinite}
@keyframes sunFloat{50%{transform:translateY(10px) scale(1.04);filter:drop-shadow(0 0 28px rgba(255,201,77,.45))}}
.hill{position:absolute;bottom:-7%;width:75%;height:22%;border-radius:50% 50% 0 0/100% 100% 0 0;background:#cfe1b9;opacity:.65}
.hill.h1{left:-18%;transform:rotate(-3deg)}.hill.h2{right:-15%;background:#b8d29f;transform:rotate(4deg)}
.leaf{position:absolute;width:12px;height:26px;border-radius:100% 0 100% 0;background:#5b9b5b;opacity:.3;animation:leaf 12s linear infinite}
@keyframes leaf{from{transform:translate3d(-5vw,20vh,0) rotate(0)}to{transform:translate3d(110vw,-20vh,0) rotate(720deg)}}
.rail{position:fixed;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,transparent,#78956c 15%,#78956c 85%,transparent);opacity:.16;z-index:-1}
/* solar hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:25px;background:linear-gradient(135deg,rgba(251,255,246,.96),rgba(231,244,218,.88));border:1px solid #c6d9b9;box-shadow:0 20px 55px rgba(48,93,54,.10)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-55px;width:230px;height:230px;border-radius:50%;border:2px dashed rgba(47,125,70,.16);animation:orbit 20s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.signal{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border-radius:999px;background:#e3f1d9;color:#2e6e3e;font-size:11px;font-weight:800}
.signal i{width:8px;height:8px;border-radius:50%;background:#4ea35c;box-shadow:0 0 0 5px rgba(78,163,92,.12);animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.35}}
.energy-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px}
.eco-meter{position:relative;height:155px;border-radius:20px;background:linear-gradient(180deg,#e9f3dd,#dcebcf);overflow:hidden;border:1px solid #c9ddbd}
.eco-meter .sunMini{position:absolute;right:24px;top:18px;width:54px;height:54px;border-radius:50%;background:#f4c95d;box-shadow:0 0 28px rgba(244,201,93,.55);animation:sunFloat 6s infinite}
.sprout{position:absolute;bottom:10px;left:12%;width:70px;height:90px}.stem{position:absolute;left:34px;bottom:0;width:5px;height:75px;background:#4f8f52;border-radius:9px}.leafA,.leafB{position:absolute;width:34px;height:20px;background:#62a45e;border-radius:100% 0 100% 0}.leafA{left:4px;bottom:42px;transform:rotate(-25deg)}.leafB{left:35px;bottom:55px;transform:scaleX(-1) rotate(-25deg)}
.floating-action{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:#2f7d46;color:#fff;font-size:23px;box-shadow:0 12px 30px rgba(47,125,70,.3);z-index:25;animation:floatBtn 3s ease-in-out infinite}
@keyframes floatBtn{50%{transform:translateY(-5px)}}
@media(max-width:850px){.energy-grid{grid-template-columns:1fr 1fr}.hero{padding:19px}}@media(max-width:560px){.energy-grid{grid-template-columns:1fr}}

/* SOLAR FUSION THEME ENGINE */
html,body,.card,.hero,header,nav button,.btn,.themeCard,.field input,.field select,.field textarea,.modalbox{
 transition:color .35s ease,background-color .35s ease,border-color .35s ease,box-shadow .35s ease,fill .35s ease
}
body.motionOff *,body.motionOff *::before,body.motionOff *::after{animation:none!important;transition:none!important}
body[data-theme="minimal"]{--bg:#f7f7f5;--surface:#fff;--surface2:#f2f2ef;--text:#191919;--muted:#686868;--line:#deded9;--accent:#2b5fd9;--accent2:#2b5fd9;--control:#f0f0ed;--controlText:#292929;--input:#fff;--inputText:#191919}
body[data-theme="night"]{--bg:#121212;--surface:#1b1b1b;--surface2:#222;--text:#f1f1ed;--muted:#aaa9a2;--line:#373737;--accent:#8ab4f8;--accent2:#a99cf7;--control:#262626;--controlText:#ededeb;--input:#1d1d1d;--inputText:#f1f1ed}
body[data-theme="morning"]{--bg:#faf8f1;--surface:#fffdf8;--surface2:#f5f0e5;--text:#26352b;--muted:#738073;--line:#ded9cb;--accent:#2d6a4f;--accent2:#c58b36;--control:#eee9dd;--controlText:#334238;--input:#fffdf9;--inputText:#26352b}
body[data-theme="solarpunk"]{--bg:#f3f7ec;--surface:#fbfff6;--surface2:#edf5df;--text:#183426;--muted:#647568;--line:#cbd9c2;--accent:#2f7d46;--accent2:#d99b32;--control:#e6f0dd;--controlText:#244332;--input:#fbfff7;--inputText:#183426}
body[data-theme="lakshmi"]{--bg:#fff8ed;--surface:#fffdf8;--surface2:#fff1d8;--text:#4b2819;--muted:#806d60;--line:#ead6bc;--accent:#9b5c18;--accent2:#b83b62;--control:#faead1;--controlText:#57341e;--input:#fffdf9;--inputText:#4b2819}
body[data-theme="spring"]{--bg:#f7fbf6;--surface:#fff;--surface2:#f1f8f0;--text:#294034;--muted:#718074;--line:#d6e5d7;--accent:#4b8b65;--accent2:#d67f9b;--control:#edf5ee;--controlText:#35513e;--input:#fff;--inputText:#294034}
body[data-theme="cyberpunk"]{--bg:#070b12;--surface:#0d1320;--surface2:#111a2a;--text:#e8f7ff;--muted:#7e9aad;--line:#20354a;--accent:#00f5d4;--accent2:#ff2bd6;--income:#00f5d4;--expense:#ff4d6d;--warning:#ffe66d;--control:#132238;--controlText:#dffcff;--input:#0b1421;--inputText:#e8f7ff}
body[data-theme="cyberpunk"]{background:radial-gradient(circle at 80% 10%,rgba(0,245,212,.14),transparent 24%),radial-gradient(circle at 10% 70%,rgba(255,43,214,.11),transparent 28%),#070b12}
body[data-theme="cyberpunk"]::before{background:linear-gradient(90deg,rgba(0,245,212,.04) 1px,transparent 1px),linear-gradient(rgba(255,43,214,.035) 1px,transparent 1px);background-size:34px 34px;animation:none}
body[data-theme="cyberpunk"] header{background:rgba(7,11,18,.84);border-color:#1d3d51}
body[data-theme="cyberpunk"] .card{box-shadow:0 0 0 1px rgba(0,245,212,.06),0 18px 50px rgba(0,0,0,.28)}
body[data-theme="cyberpunk"] nav button.active,body[data-theme="cyberpunk"] .btn.primary{background:linear-gradient(90deg,#00cdb4,#8a2be2);box-shadow:0 0 24px rgba(0,245,212,.18)}
body[data-theme="cyberpunk"] #ambientLayer .ambientSun{display:none}
body[data-theme="cyberpunk"] #ambientLayer:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px);opacity:.35}
body[data-theme="cyberpunk"] #lakshmiStage{width:290px;height:330px}
body[data-theme="cyberpunk"] #lakshmiStage .lakshmiAura{background:radial-gradient(circle,rgba(0,245,212,.28),rgba(255,43,214,.15) 42%,transparent 70%);filter:blur(10px)}
body[data-theme="cyberpunk"] #lakshmiStage .lakshmiCaption{background:#0d1320;color:#a8fff4;border-color:#00f5d4;box-shadow:0 0 20px rgba(0,245,212,.18)}
body[data-theme="cyberpunk"] #lakshmiStage .lakshmiMascot{filter:saturate(1.45) hue-rotate(10deg) drop-shadow(0 0 20px rgba(0,245,212,.32)) drop-shadow(0 0 28px rgba(255,43,214,.2))}
body[data-theme="cyberpunk"] #lakshmiStage .lakshmiPetals{color:#00f5d4;text-shadow:0 0 10px #00f5d4}
body[data-theme="lakshmi"].lakshmiAnime #lakshmiStage .lakshmiMascot{filter:saturate(1.25) drop-shadow(0 0 20px rgba(184,59,98,.25))}
body[data-theme="lakshmi"].lakshmiAnime #lakshmiStage .animeHalo{display:block}
body:not([data-theme="lakshmi"]) #lakshmiStage .animeHalo{display:none}
body[data-theme="minimal"]::before{display:none}
body[data-theme="spring"]::before{background:radial-gradient(circle at 15% 15%,rgba(214,127,155,.12),transparent 20%),radial-gradient(circle at 80% 25%,rgba(112,176,139,.12),transparent 24%)}
body[data-theme="lakshmi"]::before{background:radial-gradient(circle at 80% 10%,rgba(239,178,72,.22),transparent 24%),radial-gradient(circle at 15% 30%,rgba(184,59,98,.08),transparent 24%)}
.themeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themeCard{position:relative;min-height:115px;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;background:var(--surface);color:var(--text);overflow:hidden;cursor:pointer}
.themeCard strong{display:block;font-size:15px}.themeCard small{display:block;color:var(--muted);margin-top:5px}
.themeCard.selected{outline:2px solid var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.swatches{display:flex;gap:5px;margin-top:12px}.swatches i{width:22px;height:7px;border-radius:99px;display:block}
.autoBadge{display:inline-flex;gap:6px;align-items:center;padding:5px 8px;border-radius:99px;background:var(--control);color:var(--controlText);font-size:10px;font-weight:800}
.newsList{display:grid;gap:8px;margin-top:12px}.newsItem{padding:11px 0;border-bottom:1px solid var(--line)}.newsItem b{display:block}.newsItem small{display:block;color:var(--muted);margin-top:3px}
#marketPulse .grid3{margin-top:12px}
@media(max-width:700px){.themeGrid{grid-template-columns:1fr 1fr}}

#ambientLayer{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.ambientSun{position:absolute;width:150px;height:150px;right:7%;top:70px;border-radius:50%;background:radial-gradient(circle,#ffd56a 0 34%,rgba(255,213,106,.22) 58%,transparent 72%);animation:ambientSun 9s ease-in-out infinite}
.ambientGlow{position:absolute;left:-15%;bottom:-18%;width:65%;height:45%;border-radius:50%;background:radial-gradient(ellipse,rgba(68,139,78,.14),transparent 65%)}
.ambientLeaf{position:absolute;width:13px;height:28px;border-radius:100% 0 100% 0;background:#5a9c61;opacity:.22;animation:leafDrift 14s linear infinite}
.ambientLeaf.l1{left:4%;top:62%;animation-delay:-3s}.ambientLeaf.l2{left:55%;top:70%;animation-delay:-9s}.ambientLeaf.l3{left:86%;top:42%;animation-delay:-6s}
.ambientPetal{display:none;position:absolute;width:9px;height:13px;border-radius:100% 0 100% 0;background:#d67f9b;opacity:.35;animation:petalDrift 11s linear infinite}
body[data-theme="spring"] .ambientPetal{display:block}.p1{left:18%;top:10%;animation-delay:-2s}.p2{left:55%;top:2%;animation-delay:-7s}.p3{left:82%;top:24%;animation-delay:-5s}
@keyframes ambientSun{50%{transform:translateY(12px) scale(1.04);filter:drop-shadow(0 0 26px rgba(255,201,77,.42))}}
@keyframes leafDrift{from{transform:translate3d(-5vw,20vh,0) rotate(0)}to{transform:translate3d(110vw,-20vh,0) rotate(720deg)}}
@keyframes petalDrift{from{transform:translate3d(-5vw,0,0) rotate(0)}to{transform:translate3d(110vw,90vh,0) rotate(540deg)}}
#lakshmiStage{position:fixed;right:20px;bottom:20px;width:230px;height:280px;z-index:40;pointer-events:none;opacity:0;transform:translate3d(240px,40px,0) scale(.8)}
#lakshmiStage.show{animation:lakshmiEnter 3.9s cubic-bezier(.2,.8,.2,1) forwards}
.lakshmiMascot{position:absolute;right:0;bottom:35px;width:190px;filter:drop-shadow(0 18px 28px rgba(120,74,22,.18));animation:lakshmiFloat 2.2s ease-in-out infinite}
.lakshmiAura{position:absolute;right:20px;bottom:50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,121,.55),transparent 68%);filter:blur(5px);animation:auraPulse 1.8s infinite}
.lakshmiPetals{position:absolute;right:50px;bottom:190px;color:#d99b32;font-size:23px;letter-spacing:12px;animation:petalPop 1.6s ease-out infinite}
.lakshmiCaption{position:absolute;right:0;bottom:0;background:rgba(255,253,248,.92);border:1px solid #ead6bc;border-radius:999px;padding:7px 11px;color:#7a4a20;font-size:11px;font-weight:750;box-shadow:0 8px 24px rgba(80,45,20,.12)}

<script id="lakshmi-app-mode-js">
function isLakshmiAppMode(){
  return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || !!window.navigator.standalone;
}
function placeLakshmiForMode(){
  const el=document.getElementById("lakshmiStage");
  if(!el || !lakshmiAllowed())return;
  if(isLakshmiAppMode()){
    el.style.left="auto";
    el.style.top="auto";
    el.style.right="12px";
    el.style.bottom="12px";
    el.classList.remove("dragging");
  }
}
window.addEventListener("resize",placeLakshmiForMode);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)placeLakshmiForMode()});
</script>

function sustainabilityScore(a){
  let score=70, online=a.filter(t=>t.type==="OUT"&&t.mode==="Online").reduce((x,t)=>x+t.amount,0);
  let transport=a.filter(t=>t.type==="OUT"&&["Transport","Fuel","Travel"].includes(t.cat)).reduce((x,t)=>x+t.amount,0);
  let food=a.filter(t=>t.type==="OUT"&&t.cat==="Food & Dining").reduce((x,t)=>x+t.amount,0);
  let reusable=a.filter(t=>t.type==="OUT"&&/reus|refill|repair|second|local|public|cycle|walk/i.test((t.desc||"")+" "+(t.tags||""))).length;
  score += Math.min(12,reusable*2); score -= Math.min(10,transport/1000); score += Math.min(8,food/2500);
  return Math.max(0,Math.min(100,Math.round(score)));
}
function ecoInsights(a){
  let score=sustainabilityScore(a), food=a.filter(t=>t.type==="OUT"&&t.cat==="Food & Dining").reduce((x,t)=>x+t.amount,0);
  let online=a.filter(t=>t.type==="OUT"&&t.mode==="Online").length;
  let wants=a.filter(t=>t.type==="OUT"&&t.nw==="Want").reduce((x,t)=>x+t.amount,0);
  let tips=[];
  if(wants>0)tips.push("Try a 24-hour pause for wants above your chosen threshold.");
  if(online>3)tips.push("Batch online orders to reduce packaging and delivery trips.");
  if(food>1000)tips.push("Plan a few low-waste meals this month and track the savings.");
  if(score>=80)tips.push("Great: your spending pattern is trending resource-conscious.");
  if(!tips.length)tips.push("Add tags like repair, refill, walk, local or reusable to make the sustainability layer smarter.");
  return tips;
}

async function fetchYahoo(symbol){
  const url="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(symbol)+"?range=1d&interval=5m";
  const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("market fetch failed");
  const j=await res.json(),r=j.chart.result?.[0];if(!r)throw Error("no data");
  const p=r.indicators.quote[0].close.filter(x=>x!=null),last=p[p.length-1],first=p[0];
  return {v:last,chg:first?((last-first)/first)*100:0};
}

 minimal:{bg:"#f7f7f5",surface:"#ffffff",surface2:"#f1f1ee",text:"#191919",muted:"#707070",line:"#deded9",accent:"#191919",accent2:"#555555",income:"#16803c",expense:"#b42318",warning:"#b54708",control:"#eeeeeb",controlText:"#2b2b2b",input:"#ffffff",inputText:"#191919"},
 night:{bg:"#121212",surface:"#1b1b1b",surface2:"#232323",text:"#f1f1ed",muted:"#a5a5a0",line:"#373737",accent:"#8ab4f8",accent2:"#bb86fc",income:"#5bd18a",expense:"#ff6b6b",warning:"#ffb74d",control:"#262626",controlText:"#ededeb",input:"#1d1d1d",inputText:"#f1f1ed"},

function applyTheme(){

/* Lakshmi is a permanent little companion in Lakshmi Mode.
   No daily cap, no 08:00–19:00 window, no random slot limit. */
let lakshmiPetTimer=null;
let lakshmiPetRunning=false;
function requestLakshmiPet(immediate=false){
  if(!lakshmiAllowed()){
    lakshmiPetRunning=false;
    if(lakshmiPetTimer){clearTimeout(lakshmiPetTimer);lakshmiPetTimer=null}
    const el=document.getElementById("lakshmiStage");
    if(el)el.style.display="none";
    return;
  }
  const el=document.getElementById("lakshmiStage");
  if(!el)return;
  el.style.display="block";
  if(!lakshmiPetRunning){
    lakshmiPetRunning=true;
    moveLakshmiPet(true);
  }else if(immediate){
    moveLakshmiPet(true);
  }
}
function moveLakshmiPet(first=false){
  const el=document.getElementById("lakshmiStage");
  if(isLakshmiAppMode()){
    placeLakshmiForMode();
    lakshmiPetRunning=false;
    return;
  }
  if(!el || !lakshmiAllowed()){
    lakshmiPetRunning=false;
    return;
  }
  const pad=14, w=el.offsetWidth||220, h=el.offsetHeight||280;
  const W=window.innerWidth, H=window.innerHeight;
  const maxX=Math.max(pad,W-w-pad);
  const maxY=Math.max(76,H-h-pad);

  /* Pet-safe navigation:
     1. The DOM itself is click-through (pointer-events:none).
     2. Roaming is biased toward screen margins/corners.
     3. Avoid the central content zone where forms/buttons usually live. */
  const edge=Math.min(260,Math.max(150,Math.min(W,H)*.22));
  const zones=[
    [pad,pad,Math.min(edge,maxX),Math.min(edge,maxY)],                 // top-left
    [Math.max(pad,maxX-edge),pad,maxX,maxY],                          // top-right
    [pad,Math.max(76,maxY-edge),Math.min(edge,maxX),maxY],            // bottom-left
    [Math.max(pad,maxX-edge),Math.max(76,maxY-edge),maxX,maxY],       // bottom-right
    [pad,76,Math.min(edge,maxX),Math.min(76+edge,maxY)]               // upper-left travel
  ];
  const z=zones[Math.floor(Math.random()*zones.length)];
  const x=z[0]+Math.random()*Math.max(1,z[2]-z[0]);
  const y=z[1]+Math.random()*Math.max(1,z[3]-z[1]);
  el.style.left=Math.round(x)+"px";
  el.style.top=Math.round(y)+"px";
  el.style.right="auto";
  el.style.bottom="auto";
  el.classList.add("petRoaming");
  const delay=first?3200:(5200+Math.random()*4200);
  if(lakshmiPetTimer)clearTimeout(lakshmiPetTimer);
  lakshmiPetTimer=setTimeout(()=>moveLakshmiPet(false),delay);
}
window.addEventListener("resize",()=>{if(lakshmiAllowed())requestLakshmiPet()});

let lakshmiSpeechTimer=null;

function lakshmiPetTouched(){

  }

  }

function lakshmiPointerDown(e){
  if(!lakshmiAllowed())return;
  const el=document.getElementById("lakshmiStage");
  if(!el)return;
  e.preventDefault();
  const r=el.getBoundingClientRect();
  lakshmiDrag={
    id:e.pointerId,
    dx:e.clientX-r.left,
    dy:e.clientY-r.top,
    moved:false
  };
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  el.classList.add("dragging");
  if(lakshmiPetTimer){clearTimeout(lakshmiPetTimer);lakshmiPetTimer=null}
  lakshmiPetRunning=false;
}
function lakshmiPointerMove(e){
  if(!lakshmiDrag||e.pointerId!==lakshmiDrag.id)return;
  const el=document.getElementById("lakshmiStage");
  if(!el)return;
  const W=window.innerWidth,H=window.innerHeight;
  const w=el.offsetWidth||220,h=el.offsetHeight||280;
  const x=Math.max(8,Math.min(W-w-8,e.clientX-lakshmiDrag.dx));
  const y=Math.max(72,Math.min(H-h-8,e.clientY-lakshmiDrag.dy));
  if(Math.abs(e.movementX)+Math.abs(e.movementY)>2)lakshmiDrag.moved=true;
  el.style.left=Math.round(x)+"px";
  el.style.top=Math.round(y)+"px";
  el.style.right="auto";el.style.bottom="auto";
  el.classList.add("petDragged");
}
function lakshmiPointerUp(e){
  if(!lakshmiDrag||e.pointerId!==lakshmiDrag.id)return;
  const moved=lakshmiDrag.moved;
  const el=document.getElementById("lakshmiStage");
  lakshmiDrag=null;
  if(el){
    el.classList.remove("dragging","petDragged");
    try{el.releasePointerCapture(e.pointerId)}catch(_){}
  }
  if(!moved)lakshmiPetTouched();
  // Resume gentle roaming after the user has placed her.
  if(lakshmiAllowed()){
    lakshmiPetRunning=true;
    if(lakshmiPetTimer)clearTimeout(lakshmiPetTimer);
    lakshmiPetTimer=setTimeout(()=>moveLakshmiPet(false),9000);
  }
}
function initLakshmiInteraction(){
  const el=document.getElementById("lakshmiStage");
  if(!el||el.dataset.interactiveReady)return;
  el.dataset.interactiveReady="1";
  el.addEventListener("pointerdown",lakshmiPointerDown);
  el.addEventListener("pointermove",lakshmiPointerMove);
  el.addEventListener("pointerup",lakshmiPointerUp);
  el.addEventListener("pointercancel",lakshmiPointerUp);
  el.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      lakshmiPetTouched();
    }
  });
}
function requestLakshmiPet(immediate=false){
  const wasRunning=lakshmiPetRunning;
  // preserve the original safety/visibility logic while adding interaction.
  if(!lakshmiAllowed()){
    lakshmiPetRunning=false;
    if(lakshmiPetTimer){clearTimeout(lakshmiPetTimer);lakshmiPetTimer=null}
    const el=document.getElementById("lakshmiStage");
    if(el)el.style.display="none";
    return;
  }
  const el=document.getElementById("lakshmiStage");
  if(!el)return;
  el.style.display="block";
  initLakshmiInteraction();
  if(!wasRunning){
    lakshmiPetRunning=true;
    moveLakshmiPet(true);
  }else if(immediate && !lakshmiDrag){
    moveLakshmiPet(true);
  }
}

function openImport(){document.getElementById("modalbox").innerHTML=`<div class="row"><h2>Import your finance data</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="muted">Upload <b>Excel (.xlsx)</b>, <b>CSV</b> or a previous <b>JSON backup</b>. The app will try to recognize common column names automatically.</p><div class="drop" id="drop"><b>Drop your file here</b><p class="muted">or choose a file from your device</p><button type="button" class="btn primary" onclick="document.getElementById('file').click()">Choose file</button><input id="file" type="file" accept=".xlsx,.xls,.csv,.json" hidden></div><div id="importStatus" class="muted" style="margin-top:12px"></div><p class="muted" style="font-size:12px">For Excel parsing, this prototype loads the SheetJS parser from its public CDN when available. JSON backup works fully offline.</p>`;
document.getElementById("modal").classList.add("open");let f=document.getElementById("file"),d=document.getElementById("drop");f.onchange=e=>handleFile(e.target.files[0]);["dragenter","dragover"].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add("drag")}));["dragleave","drop"].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.remove("drag")}));d.addEventListener("drop",e=>handleFile(e.dataTransfer.files[0]))}
async function handleFile(file){if(!file)return;let st=document.getElementById("importStatus");st.textContent="Reading "+file.name+"…";try{if(file.name.toLowerCase().endsWith(".json")){let obj=JSON.parse(await file.text());db=obj;persist();document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openTx()}});
applyTheme();initAutoTheme();render();if(effectiveTheme()==="lakshmi"){requestLakshmiPet(true);initLakshmiInteraction();placeLakshmiForMode();}st.textContent="Backup restored ✓";toast("Backup imported ✓");return}if(file.name.toLowerCase().endsWith(".csv")){let text=await file.text();let rows=parseCSV(text);importRows(rows);st.textContent="Imported "+rows.length+" rows ✓";return}if(/\.xlsx?$/i.test(file.name)){await loadSheetJS();let data=await file.arrayBuffer(),book=XLSX.read(data,{type:"array"}),sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:""});importRows(rows);st.textContent="Imported "+rows.length+" rows from "+book.SheetNames[0]+" ✓";return}throw Error("Unsupported file")}catch(e){st.textContent="Could not import: "+e.message}}
function loadSheetJS(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=resolve;s.onerror=()=>reject(Error("Excel parser could not load. Try CSV or JSON."));document.head.appendChild(s)})}
function parseCSV(text){let lines=text.split(/\r?\n/).filter(x=>x.trim()),head=lines.shift().split(",").map(x=>x.replace(/^"|"$/g,""));return lines.map(line=>{let vals=[],cur="",q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"')q=!q;else if(c===","&&!q){vals.push(cur);cur=""}else cur+=c}vals.push(cur);let o={};head.forEach((h,i)=>o[h]=String(vals[i]??"").replace(/^"|"$/g,"").replace(/""/g,'"'));return o})}
function norm(x){return String(x??"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function pick(o,names){let k=Object.keys(o).find(k=>names.includes(norm(k)));return k?o[k]:""}
function importRows(rows){let added=0;for(let r of rows){let amount=parseFloat(String(pick(r,["amount","amountru","value","total","debit","credit"])).replace(/[₹,\s]/g,""));if(!isFinite(amount)||amount===0)continue;let rawType=norm(pick(r,["type","transactiontype","inout"])),type=rawType.includes("income")||rawType==="in"||rawType==="credit"?"IN":rawType.includes("transfer")?"TRANSFER":"OUT";let date=pick(r,["date","transactiondate","dt"])||new Date().toISOString().slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){let d=new Date(date);if(!isNaN(d))date=d.toISOString().slice(0,10)}db.transactions.push({id:Date.now()+added,date,type,desc:pick(r,["description","desc","details","narration","particulars"])||"Imported transaction",amount,cat:pick(r,["category","cat"])||(type==="IN"?"Imported Income":"Other Expense"),sub:pick(r,["subcategory","subcat","sub"]),method:pick(r,["paymentmode","paymentmethod","method","mode"])||"Other",merchant:pick(r,["merchant","platform","merchantplatform","vendor"]),mode:pick(r,["onlineoffline","mode"])||"Unknown",from:pick(r,["fromaccount","account","accountwallet","wallet"]),to:pick(r,["toaccount"]),nw:pick(r,["needwant","needorwant","nw"])||"N/A",rec:pick(r,["recurring","recurringyesno"])||"No",tags:pick(r,["tags"]),notes:pick(r,["notes","note"])});added++}persist();render();toast(added+" transactions imported ✓")}
function openTx(id=null){let t=id?db.transactions.find(x=>x.id===id):null,acc=db.accounts.map(a=>`<option>${esc(a.name)}</option>`).join("");document.getElementById("modalbox").innerHTML=`<div class="row"><h2>${t?"Edit":"Add"} transaction</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="submitTx(event,${id||0})"><div class="form"><div class="field"><label>Date</label><input name="date" type="date" required value="${t?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Type</label><select name="type"><option ${t?.type==="IN"?"selected":""}>IN</option><option ${t?.type==="OUT"||!t?"selected":""}>OUT</option><option ${t?.type==="TRANSFER"?"selected":""}>TRANSFER</option></select></div><div class="field full"><label>Description</label><input name="desc" required value="${esc(t?.desc||"")}"></div><div class="field"><label>Amount</label><input name="amount" type="number" step=".01" required value="${t?.amount||""}"></div><div class="field"><label>Category</label><input name="cat" list="cats" value="${esc(t?.cat||"")}"><datalist id="cats">${[...db.incomeCats,...db.categories].map(x=>`<option>${esc(x)}</option>`).join("")}</datalist></div><div class="field"><label>Subcategory</label><input name="sub" value="${esc(t?.sub||"")}"></div><div class="field"><label>Payment mode</label><select name="method">${db.methods.map(x=>`<option ${t?.method===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Merchant / platform</label><input name="merchant" value="${esc(t?.merchant||"")}"></div><div class="field"><label>Online / Offline</label><select name="mode"><option>Online</option><option ${t?.mode==="Offline"?"selected":""}>Offline</option><option ${t?.mode==="Internal"?"selected":""}>Internal</option></select></div><div class="field"><label>Account</label><select name="from"><option value="">—</option>${acc}</select></div><div class="field"><label>Need / Want</label><select name="nw"><option>Need</option><option ${t?.nw==="Want"?"selected":""}>Want</option><option>Investment</option><option>Income</option><option>N/A</option></select></div><div class="field"><label>Recurring?</label><select name="rec"><option>No</option><option ${t?.rec==="Yes"?"selected":""}>Yes</option></select></div><div class="field"><label>Tags</label><input name="tags" value="${esc(t?.tags||"")}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(t?.notes||"")}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary">Save</button>${t?`<button type="button" class="btn danger" onclick="deleteTx(${t.id})">Delete</button>`:""}</div></form>`;document.getElementById("modal").classList.add("open");if(t)document.querySelector('select[name="from"]').value=t.from||""}

function transfer(i){let a=db.accounts[i],opts=db.accounts.filter((x,j)=>j!==i).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");document.getElementById("modalbox").innerHTML=`<div class="row"><h2>Transfer from ${esc(a.name)}</h2><button class="btn" onclick="closeModal()">✕</button></div><form onsubmit="submitTransfer(event,${a.id})"><div class="form"><div class="field"><label>To</label><select name="to">${opts}</select></div><div class="field"><label>Amount</label><input name="amount" type="number" step=".01" required></div></div><button class="btn primary" style="margin-top:12px">Transfer</button></form>`;document.getElementById("modal").classList.add("open")}
